name: probe-euribor
on:
  push:
    branches: [probe-euribor]
    paths: [probe/probe_euribor.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --quiet requests
      - run: python probe/probe_euribor.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe/result.json && git commit -m "probe result" && git push
