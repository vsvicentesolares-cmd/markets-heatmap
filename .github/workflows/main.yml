name: heatmap-data

on:
  schedule:
    - cron: "7 4 * * *"   # 04:07 UTC = 05:07 Madrid in winter (06:07 in summer)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: heatmap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet yfinance pandas lxml requests
      - name: Build market data
        continue-on-error: true
        run: python scripts/build_markets.py
      - name: Build heatmap data
        continue-on-error: true
        run: python scripts/build_heatmap.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "market data $(date -u +%F)"
          git push
