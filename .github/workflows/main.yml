name: heatmap-data

on:
  schedule:
    # GitHub cron is best effort: on 16 Nov the 04:07 run started ~12:38 UTC and on 17 Nov it had not run by
    # 09:40 UTC. Extra slots give it more chances; the guard step skips a slot once today's file exists.
    - cron: "7 4 * * *"    # 04:07 UTC = 05:07 Madrid in winter (06:07 in summer)
    - cron: "23 4 * * *"
    - cron: "47 4 * * *"
    - cron: "13 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: heatmap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Skip if today's data is already built
        id: guard
        if: github.event_name == 'schedule'
        run: |
          built=$(python3 -c "import json;print(json.load(open('data/markets.json'))['generatedAt'][:10])" 2>/dev/null || echo none)
          if [ "$built" = "$(date -u +%F)" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already built today ($built)"; fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pip install --quiet yfinance pandas lxml requests
      - name: Build market data
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/build_markets.py
      - name: Build heatmap data
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/build_heatmap.py
      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "market data $(date -u +%F)"
          git pull --rebase --quiet
          git push
